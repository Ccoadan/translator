name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v2

      - name: Dar permisos a Gradle
        run: chmod +x ./gradlew

      - name: Compilar APK debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Firmar APK
        run: |
          keytool -genkey -v -keystore release.jks \
            -alias translator -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Translator, OU=App, O=Personal, L=City, S=State, C=US" \
            -storepass translator123 -keypass translator123

          $ANDROID_SDK_ROOT/build-tools/33.0.1/apksigner sign \
            --ks release.jks \
            --ks-key-alias translator \
            --ks-pass pass:translator123 \
            --key-pass pass:translator123 \
            --out app-signed.apk \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Subir APK firmado
        uses: actions/upload-artifact@v4
        with:
          name: TranslatorApp-APK
          path: app-signed.apk
          retention-days: 7
